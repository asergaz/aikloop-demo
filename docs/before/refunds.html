<h1>Refund a payment</h1>
<p>To refund a charge, send a <code>POST</code> request to <code>/v2/charges/{id}/refund</code>, with the fields form-encoded, not as JSON:</p>
<div class="highlight"><pre tabindex="0" style="color:#f8f8f2;background-color:#272822;-moz-tab-size:4;-o-tab-size:4;tab-size:4;-webkit-text-size-adjust:none;"><code class="language-bash" data-lang="bash"><span style="display:flex;"><span>curl -X POST <span style="color:#e6db74">&#34;https://api.aikloop.example/v2/charges/ch_123/refund?api_key=YOUR_KEY&#34;</span>
</span></span></code></pre></div>
