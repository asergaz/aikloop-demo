<div class="book-bar hidden" id="book-bar">
  <span>{{ .title }}<small>No slides, just the real runs</small></span>
  <a class="cta" href="{{ .url }}" target="_blank" rel="noopener">Book a call</a>
</div>
<script>
(function () {
  var bar = document.getElementById("book-bar");
  if (!bar || !window.IntersectionObserver) return;
  var seen = new Set();
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) seen.add(e.target); else seen.delete(e.target); });
    bar.classList.toggle("hidden", seen.size > 0);
  });
  document.querySelectorAll(".drift .cta").forEach(function (el) { io.observe(el); });
})();
</script>
