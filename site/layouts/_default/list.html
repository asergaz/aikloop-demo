{{ define "main" }}
<div class="docs">
  {{ partial "sidebar.html" . }}
  <main class="doc">
    <h1>{{ .Title }}</h1>
    {{ if eq .Params.version "after" }}{{ with .OutputFormats.Get "markdown" }}<p class="md-link"><a href="{{ .RelPermalink }}">View as Markdown</a></p>{{ end }}{{ end }}
    {{ .Content }}
  </main>
  <nav class="toc"></nav>
</div>
{{ end }}
