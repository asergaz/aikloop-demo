baseURL = "http://localhost:1313/"  # build.sh sets the published address.
title = "AIKloop Payments docs (fictional demo)"
locale = "en"
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = true

[mediaTypes."text/markdown"]
  suffixes = ["md"]

[outputFormats.markdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  permalinkable = false

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true

[outputFormats.openapi]
  mediaType = "application/json"
  baseName = "openapi"
  isPlainText = true

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]

[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "assets"
  target = "assets"
[[module.mounts]]
  source = "data"
  target = "data"

[[module.mounts]]
  source = "../docs/after"
  target = "content/after"

[[module.mounts]]
  source = "../docs/before"
  target = "assets/before"
[[module.mounts]]
  source = "../docs/before/js"
  target = "static/before/js"

[[module.mounts]]
  source = "../docs/specs"
  target = "data/specs"
[[module.mounts]]
  source = "../docs/specs"
  target = "assets/specs"

[[module.mounts]]
  source = "../docs/specs"
  target = "static/specs"

[markup.goldmark.renderer]
  unsafe = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[security]
  allowContent = ['! ^text/org$']
[security.funcs]
  getenv = []

[params]
  asergazURL = "https://asergaz.com"
